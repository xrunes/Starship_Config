# ~/.config/starship.toml

add_newline = true

[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "🔌"

[[battery.display]]
threshold = 30

[character]
error_symbol = "[❯](bold green)"
success_symbol = "[❯](bold green)"

[directory]
truncation_length = 10
truncation_symbol = '…/'

[git_branch]
format = "[$symbol$branch]($style) "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
# conflicted = "⚔️ "
# ahead = "🏎️ 💨*${count} "
# behind = "🐢*${count} "
# diverged = "🔱 🏎️ 💨*${ahead_count} 🐢*${behind_count} "
# untracked = "🛤️*${count} "
# stashed = "📦 "
# modified = "📝*${count} "
# staged = "🗃️*${count} "
# renamed = "📛*${count} "
# deleted = "🗑️*${count} "
# style = "bright-white"
# format = "$all_status$ahead_behind"
disabled = true

[hostname]
ssh_only = false
disabled = true

[localip]
ssh_only = false
style = "bold dimmed yellow"
disabled = true

[memory_usage]
format = "$symbol[${ram}( | ${ram_pct})]($style) "
threshold = 0
style = "bold dimmed white"
symbol = "🪟🐧 "
disabled = false

[package]
disabled = true

[time]
disabled = true

[username]
show_always = true
disabled = true
format = "[$user]($style)@"
